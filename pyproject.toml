[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "handact"
version = "0.1.0"
description = "ACT robot learning with MediaPipe hand-tracking teleoperation via LeRobot"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["handact*"]

[tool.ruff]
line-length = 100
